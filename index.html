<title>SJR XPERT — Repair Shop Manager</title>
<style>
:root{--blue:#075ee8;--navy:#0b1f44;--cyan:#22d3ee;--bg:#f3f7ff;--card:#fff;--text:#12213b;--muted:#71809b;--line:#e4ebf7;--green:#0b9b72;--shadow:0 12px 32px #123d8010}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1240px;margin:auto;min-height:100vh}
.top{position:sticky;top:0;z-index:10;background:#ffffffed;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:58px;height:58px;flex-shrink:0;display:block;object-fit:contain;border-radius:10px;background:#0b1f44}
.brand{font-weight:900;letter-spacing:.04em}.sub{font-size:12px;color:var(--muted)}.grow{flex:1}.pill{font-size:12px;padding:6px 10px;background:#e8f1ff;color:var(--blue);border-radius:99px;font-weight:750}
.layout{display:grid;grid-template-columns:225px 1fr;gap:22px;padding:22px 16px}.side{align-self:start;position:sticky;top:82px;background:white;padding:10px;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.nav{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:13px;background:transparent;color:#667590;text-align:left;font-weight:700;margin:2px 0;transition:.2s}.nav:hover{background:#eff5ff;transform:translateX(2px)}.nav.active{background:linear-gradient(100deg,#e8f1ff,#f3fcff);color:var(--blue)}
.main{min-width:0;animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:clamp(24px,3vw,34px);letter-spacing:-.04em;margin:0 0 5px}.lead{color:var(--muted);margin:0 0 20px}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.btn{padding:11px 15px;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;box-shadow:0 7px 16px #075ee82a;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px #075ee833}.btn.danger{background:#b42318;color:#fff;border-color:#b42318}.btn.alt{background:#edf3ff;color:var(--blue);box-shadow:none}.btn.dark{background:var(--navy)}.btn.small{padding:8px 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);min-width:0}.stat{position:relative;overflow:hidden;transition:.25s}.stat:hover{transform:translateY(-4px)}.stat:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:#eaf3ff;right:-35px;top:-38px}.stat .k{font-size:12px;color:var(--muted);font-weight:750}.stat .v{font-size:27px;font-weight:900;letter-spacing:-.04em;margin:8px 0 2px}.stat .icon{font-size:20px}.section{margin-top:18px}.section-title{font-size:17px;font-weight:850;margin:0 0 12px}.split{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.muted{color:var(--muted)}.smalltxt{font-size:12px}.list{display:grid;gap:10px}.item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px}.avatar{width:40px;height:40px;border-radius:13px;background:#eaf2ff;color:var(--blue);display:grid;place-items:center;font-weight:900;flex-shrink:0}.itemmain{flex:1;min-width:0}.itemmain strong{display:block;overflow-wrap:anywhere}.tag{display:inline-flex;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800;background:#e9f2ff;color:var(--blue)}.tag.green{background:#e2fbf2;color:#07845f}.tag.orange{background:#fff2dc;color:#9a5b00}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field label{font-size:12px;color:#667590;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid #dce5f3;border-radius:12px;padding:11px 12px;background:white;color:var(--text);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #075ee817}.full{grid-column:1/-1}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:15px}table{width:100%;border-collapse:collapse;min-width:560px;background:white}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px}th{background:#f7faff;color:#6b7b96;font-size:11px;text-transform:uppercase;letter-spacing:.05em}tr:last-child td{border-bottom:0}.totalbox{background:linear-gradient(135deg,#092b68,#075ee8);color:white;border-radius:18px;padding:18px}.totalbox .big{font-size:32px;font-weight:900;letter-spacing:-.04em}.empty{padding:30px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);background:#102448;color:white;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}.mobile-nav{display:none}.foot{padding:0 16px 22px;color:var(--muted);font-size:12px}.ai-bubble{background:linear-gradient(135deg,#eef5ff,#f4fdff);border:1px solid #dcecff;border-radius:16px;padding:14px}
@media(max-width:900px){.layout{grid-template-columns:1fr;padding:16px 12px 92px}.side{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.top{padding:10px 12px}.mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;gap:3px;padding:8px 4px calc(8px + env(safe-area-inset-bottom));background:#ffffffef;backdrop-filter:blur(16px);border-top:1px solid var(--line)}.mobile-nav button{display:grid;justify-items:center;gap:3px;background:transparent;color:#70809a;font-size:10px;font-weight:800;padding:5px 7px;border-radius:10px}.mobile-nav button.active{color:var(--blue);background:#edf4ff}.mobile-nav span{font-size:18px}.card{padding:15px}.stat .v{font-size:24px}}
@media(max-width:420px){.grid{gap:9px}.stat .v{font-size:21px}.card{border-radius:16px;padding:13px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.pill{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

function getSupabaseConfig(){const url=(localStorage.getItem('sjrxpert_supabase_url')||'').trim().replace(/\/$/,'');const key=(localStorage.getItem('sjrxpert_supabase_key')||'').trim();if(!url||!key||!/^https:\/\/[a-zA-Z0-9.-]+$/.test(url))return null;return {url,key}}
function initSupabaseClient(){const cfg=getSupabaseConfig();if(!cfg||!window.supabase?.createClient){supabaseClient=null;return null}if(!supabaseClient||supabaseClient.supabaseUrl!==cfg.url){supabaseClient=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}return supabaseClient}
async function refreshAuthStatus(){const el=document.getElementById('authStatus');if(!el)return;const client=initSupabaseClient();if(!client){el.textContent='Save your Supabase project URL and publishable/anon key first.';return}try{const {data,error}=await client.auth.getSession();if(error)throw error;el.textContent=data.session?'Signed in as '+data.session.user.email:'Not signed in. Use your staff account below.'}catch(e){el.textContent='Auth status unavailable: '+(e.message||e)}}
async function signInStaff(){const client=initSupabaseClient();if(!client){toast('Save Supabase URL and public key first');return}const email=document.getElementById('authEmail')?.value.trim(),password=document.getElementById('authPassword')?.value;if(!email||!password){toast('Enter staff email and password');return}const {error}=await client.auth.signInWithPassword({email,password});if(error){toast('Sign-in failed: '+error.message);return}if(document.getElementById('authPassword'))document.getElementById('authPassword').value='';await refreshAuthStatus();toast('Signed in securely');showPage('settings')}
async function signOutStaff(){const client=initSupabaseClient();if(!client){toast('Supabase is not configured');return}const {error}=await client.auth.signOut();if(error){toast('Sign-out failed: '+error.message);return}await refreshAuthStatus();toast('Signed out')}
async function sendPasswordReset(){const client=initSupabaseClient();if(!client){toast('Save Supabase URL and public key first');return}const email=document.getElementById('authEmail')?.value.trim();if(!email){toast('Enter your staff email first');return}const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error){toast('Reset request failed: '+error.message);return}toast('If this email is registered, Supabase will send reset instructions')}
function persist(){localStorage.setItem('sjrxpert_db',JSON.stringify(db))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function total(r){return Math.max(0,r.parts.reduce((s,p)=>s+p.qty*p.price,0)+(+r.labour||0)-(+r.discount||0))}
function paid(r){return +r.paid||0}
function due(r){return Math.max(0,total(r)-paid(r))}
function statusTag(s){return `<span class="tag ${s==='Completed'?'green':s==='In progress'?'orange':''}">${esc(s)}</span>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(){let navhtml=pages.map(([id,ic,label])=>`<button class="nav ${current===id?'active':''}" onclick="showPage('${id}')"><span>${ic}</span>${label}</button>`).join('');document.getElementById('sidebar').innerHTML=navhtml;document.getElementById('mobileNav').innerHTML=pages.filter(p=>['dashboard','repairs','billing','customers','ai'].includes(p[0])).map(([id,ic,label])=>`<button class="${current===id?'active':''}" onclick="showPage('${id}')"><span>${ic}</span>${label}</button>`).join('')}
function showPage(id){current=id;nav();const el=document.getElementById('main');el.innerHTML=render();if(id==='settings'){document.getElementById('shopName').value=localStorage.getItem('sjrxpert_shopName')||'SJR XPERT';document.getElementById('terms').value=localStorage.getItem('sjrxpert_terms')||'';document.getElementById('supabaseUrl').value=localStorage.getItem('sjrxpert_supabase_url')||'';document.getElementById('supabaseKey').value=localStorage.getItem('sjrxpert_supabase_key')||'';document.getElementById('upiId').value=localStorage.getItem('sjrxpert_upi_id')||'';document.getElementById('shopAddress').value=localStorage.getItem('sjrxpert_shopAddress')||'';document.getElementById('shopPhone').value=localStorage.getItem('sjrxpert_shopPhone')||'';refreshAuthStatus();}window.scrollTo({top:0,behavior:'smooth'})}
function head(title,desc,button=''){return `<div class="heading"><div><h1>${title}</h1><p class="lead">${desc}</p></div>${button}</div>`}
function card(title,body,extra=''){return `<section class="card ${extra}"><div class="section-title">${title}</div>${body}</section>`}
function render(){switch(current){case'dashboard':return dashboard();case'repairs':return repairsPage();case'billing':return billingPage();case'customers':return customersPage();case'inventory':return inventoryPage();case'payments':return paymentsPage();case'reports':return reportsPage();case'ai':return aiPage();case'settings':return settingsPage();default:return dashboard()}}
function dashboard(){let today=new Date().toISOString().slice(0,10),todays=db.payments.filter(p=>p.date===today).reduce((s,p)=>s+p.amount,0),open=db.repairs.filter(r=>r.status!=='Completed').length,owed=db.repairs.reduce((s,r)=>s+due(r),0);return head('Good day, repair expert.','Your shop at a glance. Fix devices, track parts, and keep every bill crystal clear.',`<button class="btn" onclick="showPage('repairs')">＋ New repair</button>`)+`<div class="grid">${stat('Active repairs',open,'🔧','Live queue')}${stat('Collected today',money(todays),'₹','Recorded payments')}${stat('Outstanding',money(owed),'◷','Balance due')}${stat('Customers',db.customers.length,'♙','Registered')}</div><div class="split section">${card('Recent repair jobs',`<div class="list">${db.repairs.slice(0,5).map(r=>`<div class="item"><div class="avatar">🔧</div><div class="itemmain"><strong>${esc(r.device)} · ${esc(r.id)}</strong><span class="muted smalltxt">${esc(r.customer)} · ${esc(r.fault)}</span></div>${statusTag(r.status)}</div>`).join('')||'<div class="empty">No repair jobs yet.</div>'}</div>`)}${card('Stock overview',`<div class="grid"><div><div class="muted smalltxt">Parts in inventory</div><strong>${db.inventory.length}</strong></div><div><div class="muted smalltxt">Total units</div><strong>${db.inventory.reduce((n,p)=>n+(+p.qty||0),0)}</strong></div><div><div class="muted smalltxt">Stock value</div><strong>${money(db.inventory.reduce((n,p)=>n+(+p.qty||0)*(+p.price||0),0))}</strong></div></div><button class="btn alt section" onclick="showPage('inventory')">Open stock / parts →</button>`)}${card('Quick actions',`<div class="list"><button class="btn" onclick="showPage('repairs')">＋ Create repair job</button><button class="btn alt" onclick="showPage('billing')">▤ Make an itemised bill</button><button class="btn alt" onclick="showPage('inventory')">▦ Manage components</button><button class="btn alt" onclick="showPage('payments')">₹ Record payment</button></div><div class="ai-bubble section"><strong>✦ XPERT AI</strong><div class="smalltxt muted">Ask for repair guidance or a clear customer explanation.</div><button class="btn small section" onclick="showPage('ai')">Open AI assistant →</button></div>`)}</div>`}
function stat(k,v,ic,sub){return `<div class="card stat"><div class="row between"><span class="k">${k}</span><span class="icon">${ic}</span></div><div class="v">${v}</div><div class="smalltxt muted">${sub}</div></div>`}
function repairsPage(){return head('Repair desk','Track each device from intake to handover.',`<button class="btn" onclick="document.getElementById('newRepair').scrollIntoView({behavior:'smooth'})">＋ Add repair</button>`)+card('Repair queue',`<div class="list">${db.repairs.map(r=>`<div class="item"><div class="avatar">📱</div><div class="itemmain"><strong>${esc(r.id)} · ${esc(r.device)}</strong><span class="muted smalltxt">${esc(r.customer)} · ${esc(r.phone)}<br>${esc(r.fault)} · ${money(total(r))}</span><div class="row section"><select aria-label="Repair status" onchange="setStatus('${r.id}',this.value)" style="padding:7px;border:1px solid var(--line);border-radius:9px">${['Received','In progress','Completed'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn alt small" onclick="selectBill('${r.id}')">Open bill</button></div></div>${statusTag(r.status)}</div>`).join('')||'<div class="empty">No repairs found.</div>'}</div>`)+`<section class="card section" id="newRepair"><div class="section-title">Create new repair job</div><form class="formgrid" onsubmit="addRepair(event)"><div class="field"><label>Customer name</label><input name="customer" required placeholder="Customer name"></div><div class="field"><label>Mobile number</label><input name="phone" required inputmode="numeric" pattern="[0-9]{10}" placeholder="10-digit number"></div><div class="field full"><label>Customer address</label><textarea name="address" rows="2" placeholder="Door no., street, area, city, PIN code"></textarea></div><div class="field"><label>Device model</label><input name="device" required placeholder="e.g. OPPO A3x 5G"></div><div class="field"><label>Reported fault</label><input name="fault" required placeholder="e.g. charging problem"></div><div class="field"><label>Estimated labour (₹)</label><input name="labour" type="number" min="0" value="250"></div><div class="field"><label>Intake date</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="full"><button class="btn">Create repair</button></div></form></section>`}
function setStatus(id,s){let r=db.repairs.find(x=>x.id===id);if(r)r.status=s;persist();showPage('repairs');toast('Repair status updated')}
function addRepair(e){e.preventDefault();let f=new FormData(e.target),phone=String(f.get('phone')||'').trim(),address=String(f.get('address')||'').trim(),existing=db.customers.find(c=>c.phone===phone);if(!existing){existing={id:'SJC-'+phone,name:f.get('customer'),phone,address};db.customers.push(existing)}else{existing.name=f.get('customer');if(address)existing.address=address}let id='SJ-'+String(Date.now()).slice(-6);db.repairs.unshift({id,customer:f.get('customer'),phone,address:address||(existing&&existing.address)||'',device:f.get('device'),fault:f.get('fault'),status:'Received',date:f.get('date')||new Date().toISOString().slice(0,10),parts:[],labour:+f.get('labour')||0,discount:0,paid:0});persist();showPage('repairs');toast('Repair job created')}

function billingPage(){let r=db.repairs.find(x=>x.id===selectedRepair)||db.repairs[0];if(!r)return head('Bills','Create itemised repair bills.')+card('No repair yet','Add a repair job first.');selectedRepair=r.id;return head('Itemised bill','Every component, labour charge and payment in one clear invoice.',`<div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn" onclick="printBillPdf('${r.id}')">⬇ PDF / Print bill</button><button class="btn alt" onclick="shareBill('${r.id}')">WhatsApp</button><button class="btn alt" onclick="smsBill('${r.id}')">SMS</button></div>`)+`<div class="split"><section class="card"><div class="row between"><div><div class="sub">SJR XPERT · REPAIR INVOICE</div><h2 style="margin:4px 0">${esc(r.id)}</h2><div class="smalltxt muted">${esc(localStorage.getItem('sjrxpert_shopAddress')||'Shop address not set in Settings')} · ${esc(localStorage.getItem('sjrxpert_shopPhone')||'')}</div></div>${statusTag(r.status)}</div><div class="formgrid section"><div class="field"><label>Repair job</label><select onchange="selectBill(this.value)">${db.repairs.map(x=>`<option value="${x.id}" ${x.id===r.id?'selected':''}>${esc(x.id)} · ${esc(x.device)}</option>`).join('')}</select></div><div class="field"><label>Customer ID</label><input readonly value="${esc('SJC-'+r.phone)}"></div><div class="field"><label>Customer name</label><input value="${esc(r.customer)}" onchange="editRepair('${r.id}','customer',this.value)"></div><div class="field"><label>Mobile number</label><input value="${esc(r.phone)}" onchange="editRepair('${r.id}','phone',this.value)"></div><div class="field full"><label>Customer address</label><textarea rows="2" onchange="editRepair('${r.id}','address',this.value)">${esc(r.address||db.customers.find(c=>c.phone===r.phone)?.address||'')}</textarea></div><div class="field full"><label>Device / fault</label><input value="${esc(r.device+' — '+r.fault)}" readonly></div></div><div class="section-title section">Components used</div><div class="tablewrap"><table><thead><tr><th>Component</th><th>Qty</th><th>Unit price</th><th>Amount</th><th></th></tr></thead><tbody>${r.parts.map((p,i)=>`<tr><td><input aria-label="Component name" value="${esc(p.name)}" onchange="editPart('${r.id}',${i},'name',this.value)" style="width:140px;border:1px solid var(--line);padding:7px;border-radius:8px"></td><td><input aria-label="Quantity" type="number" min="0" value="${p.qty}" onchange="editPart('${r.id}',${i},'qty',this.value)" style="width:55px;border:1px solid var(--line);padding:7px;border-radius:8px"></td><td><input aria-label="Unit price" type="number" min="0" value="${p.price}" onchange="editPart('${r.id}',${i},'price',this.value)" style="width:85px;border:1px solid var(--line);padding:7px;border-radius:8px"></td><td><strong>${money(p.qty*p.price)}</strong></td><td><button class="btn alt small" onclick="removePart('${r.id}',${i})">×</button></td></tr>`).join('')||'<tr><td colspan="5">No components added.</td></tr>'}</tbody></table></div><form class="formgrid section" onsubmit="addPart(event,'${r.id}')"><div class="field"><label>New component</label><input name="name" required placeholder="e.g. charging flex"></div><div class="field"><label>Quantity</label><input name="qty" type="number" min="1" value="1" required></div><div class="field"><label>Unit price (₹)</label><input name="price" type="number" min="0" required placeholder="0"></div><div class="field" style="align-self:end"><button class="btn">＋ Add component</button></div></form><div class="formgrid section"><div class="field"><label>Labour (₹)</label><input type="number" min="0" value="${r.labour}" onchange="editRepair('${r.id}','labour',this.value)"></div><div class="field"><label>Discount (₹)</label><input type="number" min="0" value="${r.discount}" onchange="editRepair('${r.id}','discount',this.value)"></div></div></section><div><div class="totalbox"><div>FINAL BILL TOTAL</div><div class="big">${money(total(r))}</div><div class="smalltxt" style="opacity:.8">Includes listed components + labour − discount</div><hr style="border:0;border-top:1px solid #ffffff44;margin:16px 0"><div class="row between"><span>Components</span><strong>${money(r.parts.reduce((s,p)=>s+p.qty*p.price,0))}</strong></div><div class="row between"><span>Labour</span><strong>${money(r.labour)}</strong></div><div class="row between"><span>Discount</span><strong>−${money(r.discount)}</strong></div><div class="row between section"><span>Paid</span><strong>${money(paid(r))}</strong></div><div class="row between"><span>Balance</span><strong>${money(due(r))}</strong></div></div><section class="card section"><div class="section-title">Record payment</div><form class="list" onsubmit="recordPayment(event,'${r.id}')"><div class="field"><label>Amount received (₹)</label><input name="amount" type="number" min="1" max="${due(r)}" required placeholder="${due(r)}"></div><div class="field"><label>Method</label><select name="method" id="paymentMethod" onchange="toggleUpiQr('${r.id}')" required><option value="" selected disabled>Select payment method</option><option>UPI</option><option>Cash</option><option>Card / POS</option><option>Bank transfer</option></select></div><div id="upiQrPanel" class="field full" hidden></div><div class="field"><label>Reference / UTR (optional)</label><input name="ref" placeholder="Transaction reference"></div><button class="btn">Record as received</button><p class="smalltxt muted">This records a manual entry only. It does not verify UPI or process money.</p></form><div class="row section" style="gap:8px;flex-wrap:wrap"><button class="btn" onclick="printBillPdf('${r.id}')">Create PDF bill</button><button class="btn alt" onclick="shareBill('${r.id}')">Send on WhatsApp</button><button class="btn alt" onclick="smsBill('${r.id}')">Send SMS</button></div><p class="muted smalltxt">Messaging apps open with a prepared message; you must tap Send. To include the logo and full bill in WhatsApp, create the PDF first and attach it in WhatsApp.</p></section><section class="card section"><div class="section-title">Payment history for this bill</div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Method</th><th>Amount</th><th>Reference</th></tr></thead><tbody>${db.payments.filter(p=>p.job===r.id).map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(p.method)}</td><td><strong>${money(p.amount)}</strong></td><td>${esc(p.ref||'—')}</td></tr>`).join('')||'<tr><td colspan="4">No payments recorded for this bill yet.</td></tr>'}</tbody></table></div></section></div></div>`}
function editRepair(id,k,v){let r=db.repairs.find(x=>x.id===id);if(r){r[k]=['labour','discount','paid'].includes(k)?Math.max(0,+v||0):v;persist();showPage('billing')}}
function editPart(id,i,k,v){let r=db.repairs.find(x=>x.id===id);if(r){r.parts[i][k]=k==='name'?v:Math.max(0,+v||0);persist();showPage('billing')}}
function addPart(e,id){e.preventDefault();let f=new FormData(e.target),r=db.repairs.find(x=>x.id===id);r.parts.push({name:f.get('name'),qty:+f.get('qty'),price:+f.get('price')});persist();showPage('billing');toast('Component added')}
function removePart(id,i){let r=db.repairs.find(x=>x.id===id);r.parts.splice(i,1);persist();showPage('billing')}
function getBillData(id){const r=db.repairs.find(x=>x.id===id);if(!r)return null;const customer=db.customers.find(c=>c.phone===r.phone)||{};return {r,shopName:localStorage.getItem('sjrxpert_shopName')||'SJR XPERT',shopAddress:localStorage.getItem('sjrxpert_shopAddress')||'',shopPhone:localStorage.getItem('sjrxpert_shopPhone')||'',terms:localStorage.getItem('sjrxpert_terms')||'',customerAddress:r.address||customer.address||'',logo:document.querySelector('header .logo')?.src||''}}

e)}<br><strong>Status:</strong> ${esc(r.status)}</div><div class="box"><strong>Bill To:</strong> ${esc(r.customer)}<br><strong>Customer ID:</strong> ${esc('SJC-'+r.phone)}<br><strong>Mobile:</strong> ${esc(r.phone)}<br><strong>Address:</strong> ${esc(b.customerAddress||'Not provided')}</div></div><div class="box"><strong>Device:</strong> ${esc(r.device)}<br><strong>Reported fault:</strong> ${esc(r.fault)}</div><table><thead><tr><th>Component / service</th><th>Qty</th><th>Unit price</th><th>Amount</th></tr></thead><tbody>${parts||'<tr><td colspan="4">Repair service</td></tr>'}<tr><td>Labour</td><td>1</td><td>${esc(money(r.labour))}</td><td>${esc(money(r.labour))}</td></tr>${r.discount?`<tr><td>Discount</td><td>1</td><td>−${esc(money(r.discount))}</td><td>−${esc(money(r.discount))}</td></tr>`:''}</tbody></table><div class="totals"><div>Parts subtotal: <strong>${esc(money(r.parts.reduce((s,p)=>s+p.qty*p.price,0)))}</strong></div><div>Labour: <strong>${esc(money(r.labour))}</strong></div><div>Discount: <strong>−${esc(money(r.discount))}</strong></div><div>Paid: <strong>${esc(money(paid(r)))}</strong></div><div>Balance due: <strong>${esc(money(due(r)))}</strong></div><div class="grand">TOTAL: ${esc(money(total(r)))}</div></div>${b.terms?`<div class="terms"><strong>Terms / warranty</strong><br>${esc(b.terms)}</div>`:''}<div class="footer">Thank you for choosing ${esc(b.shopName)}. This is a computer-generated repair bill.</div><button class="no-print" onclick="window.print()">Print / Save as PDF</button><script>window.onload=()=>setTimeout(()=>window.print(),350)<\/script></body></html>`);w.document.close()}

 const rows=db.customers.map(c=>`<div class="item"><div class="avatar">♙</div><div class="itemmain"><strong>${esc(c.name)}</strong><span class="muted smalltxt">${esc(c.phone)}</span><div class="smalltxt">${esc(c.address||'Address not added')}</div><div class="smalltxt"><span class="tag">${esc(c.id)}</span></div></div><button class="btn alt small" onclick="window.open('https://wa.me/91${esc(c.phone)}','_blank')">WhatsApp</button><button class="btn danger" style="display:inline-flex!important;visibility:visible!important;opacity:1!important;min-width:78px;justify-content:center" onclick="deleteCustomer('${esc(c.phone)}')">🗑 Delete</button></div>`).join('')||'<div class="empty">No customers yet.</div>';
 return head('Customers','Customer deletion requires Manager approval and removes the customer’s linked repair jobs, bills and payment records from this browser.',`<button class="btn" onclick="document.getElementById('customerForm').scrollIntoView({behavior:'smooth'})">＋ Add customer</button>`)+card('Customer directory',`<p class="muted smalltxt"><strong>Warning:</strong> After Manager approval, the customer, matching repair jobs, linked bills (generated from repair jobs), and related payment entries are permanently removed from this browser’s local data. Export a backup first if you may need these records. Supabase cloud rows are not deleted by this HTML file.</p><div class="list">${rows}</div>`)+`<section class="card section" id="customerForm"><div class="section-title">Register customer</div><form class="formgrid" onsubmit="addCustomer(event)"><div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>10-digit mobile</label><input name="phone" required pattern="[0-9]{10}" inputmode="numeric"></div><div class="field full"><label>Customer address</label><textarea name="address" rows="2" placeholder="Door no., street, area, city, PIN code"></textarea></div><div><button class="btn">Create customer ID</button></div></form></section>`
}
let pendingCustomerDeletePhone=null;
function deleteCustomer(phone){
 const customer=db.customers.find(c=>String(c.phone)===String(phone));if(!customer)return;
 pendingCustomerDeletePhone=String(phone);
 let modal=document.getElementById('managerApprovalModal');
 if(!modal){
  modal=document.createElement('div');modal.id='managerApprovalModal';
  modal.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.68);display:flex;align-items:center;justify-content:center;padding:18px;';
  modal.innerHTML=`<section role="dialog" aria-modal="true" aria-labelledby="managerApprovalTitle" style="width:min(100%,460px);background:var(--card,#fff);color:var(--text,#111);border:1px solid var(--line,#ddd);border-radius:18px;padding:22px;box-shadow:0 18px 60px #0005"><h2 id="managerApprovalTitle" style="margin:0 0 8px">🔐 Manager approval required</h2><p id="managerApprovalCustomer" class="muted smalltxt"></p><p class="smalltxt"><strong>Permanent deletion:</strong> after manager verification, this removes the customer, linked repair jobs, bills generated from those jobs, and related payment entries from this browser. Export a backup first if you may need these records.</p><div class="field" style="margin:14px 0"><label for="managerApprovalEmail">Manager email</label><input id="managerApprovalEmail" type="email" autocomplete="username" required placeholder="manager@example.com" style="width:100%"></div><div class="field" style="margin:14px 0"><label for="managerApprovalPassword">Manager password</label><input id="managerApprovalPassword" type="password" autocomplete="current-password" required placeholder="Manager password" style="width:100%"></div><p id="managerApprovalError" class="smalltxt" style="color:#dc2626;min-height:1em" aria-live="polite"></p><div class="row" style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap"><button class="btn alt" type="button" onclick="closeManagerApproval()">Cancel</button><button class="btn danger" id="managerApprovalConfirm" type="button" onclick="approveCustomerDelete()">Approve & delete all linked records</button></div><p class="muted smalltxt" style="margin-top:14px">This HTML version only changes data stored in this browser. It does not delete Supabase cloud records.</p></section>`;
  document.body.appendChild(modal);
 }
 document.getElementById('managerApprovalCustomer').textContent='Customer and related records to delete: '+customer.name+' ('+customer.phone+')';
 document.getElementById('managerApprovalEmail').value='';document.getElementById('managerApprovalPassword').value='';document.getElementById('managerApprovalError').textContent='';
 document.getElementById('managerApprovalConfirm').disabled=false;document.getElementById('managerApprovalConfirm').textContent='Approve & delete all linked records';
 modal.style.display='flex';document.getElementById('managerApprovalEmail').focus();
}

function closeManagerApproval(){const modal=document.getElementById('managerApprovalModal');if(modal)modal.style.display='none';pendingCustomerDeletePhone=null}
async function approveCustomerDelete(){
 const phone=pendingCustomerDeletePhone;if(!phone)return;
 const email=document.getElementById('managerApprovalEmail')?.value.trim();
 const password=document.getElementById('managerApprovalPassword')?.value;
 const errorEl=document.getElementById('managerApprovalError');
 const button=document.getElementById('managerApprovalConfirm');
 if(!email||!password){errorEl.textContent='Enter the manager email and password.';return}
 const client=initSupabaseClient();
 if(!client){errorEl.textContent='Configure the Supabase URL and publishable/anon key in Settings first.';return}
 button.disabled=true;button.textContent='Verifying manager…';errorEl.textContent='';
 try{
  const {data,error}=await client.auth.signInWithPassword({email,password});
  if(error||!data?.user)throw new Error('Manager sign-in failed. Check the credentials.');
  const meta=data.user.app_metadata||{};
  const isManager=meta.role==='manager'||(Array.isArray(meta.roles)&&meta.roles.includes('manager'));
  if(!isManager)throw new Error('This account is not authorised as a manager. Ask the Supabase project owner to set app_metadata.role = manager.');
  const normalizePhone=value=>String(value??'').replace(/\D/g,'').replace(/^91(?=\d{10}$)/,'');
  const customer=db.customers.find(c=>normalizePhone(c.phone)===normalizePhone(phone));
  if(!customer)throw new Error('Customer was not found. Refresh the customer list.');
  const customerName=String(customer.name||'').trim().toLowerCase();
  const customerId=String(customer.id||'');
  // Match phone numbers after removing spaces/+91/punctuation. Also support older records linked by customer ID or name.
  const matchingRepairs=(db.repairs||[]).filter(r=>{
   const repairPhone=normalizePhone(r.phone);
   const phoneMatch=repairPhone && repairPhone===normalizePhone(customer.phone);
   const idMatch=(r.customerId!=null&&String(r.customerId)===customerId)||(r.customer_id!=null&&String(r.customer_id)===customerId);
   const nameMatch=String(r.customer||r.customerName||'').trim().toLowerCase()===customerName;
   return phoneMatch||idMatch||(!repairPhone&&nameMatch);
  });
  const jobIds=new Set(matchingRepairs.map(r=>String(r.id)));
  const relatedPayment=p=>{
   const jobRef=p.job??p.jobId??p.repairId??p.repair_id??p.repair;
   const phoneRef=normalizePhone(p.phone??p.customerPhone??p.customer_phone);
   const idRef=String(p.customerId??p.customer_id??'');
   const nameRef=String(p.customer??p.customerName??'').trim().toLowerCase();
   return (jobRef!=null&&jobIds.has(String(jobRef))) || (phoneRef&&phoneRef===normalizePhone(customer.phone)) || (idRef&&idRef===customerId) || (!phoneRef&&!idRef&&nameRef===customerName);
  };
  const paymentCountBefore=(db.payments||[]).length;
  db.payments=(db.payments||[]).filter(p=>!relatedPayment(p));
  const removedPayments=paymentCountBefore-db.payments.length;
  const repairCountBefore=(db.repairs||[]).length;
  db.repairs=(db.repairs||[]).filter(r=>!matchingRepairs.includes(r));
  const removedRepairs=repairCountBefore-db.repairs.length;
  // Some older builds may store bills separately; remove only bills linked to this customer's matched repair jobs.
  let removedBills=0;
  if(Array.isArray(db.bills)){
   const before=db.bills.length;
   db.bills=db.bills.filter(b=>{
    const jobRef=b.job??b.jobId??b.repairId??b.repair_id??b.repair;
    const billPhone=normalizePhone(b.phone??b.customerPhone??b.customer_phone);
    const billCustomerId=String(b.customerId??b.customer_id??'');
    const billName=String(b.customer??b.customerName??'').trim().toLowerCase();
    const linked=(jobRef!=null&&jobIds.has(String(jobRef)))||(billPhone&&billPhone===normalizePhone(customer.phone))||(billCustomerId&&billCustomerId===customerId)||(!billPhone&&!billCustomerId&&billName===customerName);
    return !linked;
   });
   removedBills=before-db.bills.length;
  }
  db.customers=(db.customers||[]).filter(c=>normalizePhone(c.phone)!==normalizePhone(phone));
  if(selectedRepair&&jobIds.has(String(selectedRepair)))selectedRepair=db.repairs[0]?.id||null;
  persist();
  closeManagerApproval();showPage('customers');
  toast('Manager approved. Deleted customer, '+removedRepairs+' repair job(s), '+(removedRepairs+removedBills)+' bill record(s), and '+removedPayments+' payment record(s) from this browser.');
 }catch(err){errorEl.textContent=String(err.message||'Approval failed.');}
 finally{
  if(button){button.disabled=false;button.textContent='Approve & delete all linked records'}
  const pw=document.getElementById('managerApprovalPassword');if(pw)pw.value='';
 }
}

function addCustomer(e){e.preventDefault();let f=new FormData(e.target),phone=String(f.get('phone')||'').trim(),name=String(f.get('name')||'').trim();if(db.customers.some(c=>c.phone===phone)){toast('This mobile number already has a customer ID');return}db.customers.push({id:'SJC-'+phone,name,phone,address:String(f.get('address')||'').trim()});persist();showPage('customers');toast('Customer saved on this device. Cloud sync is not enabled without sign-in.')}

function saveSupabaseSettings(){const url=document.getElementById('supabaseUrl').value.trim().replace(/\/$/,'');const key=document.getElementById('supabaseKey').value.trim();if(!/^https:\/\/[a-zA-Z0-9.-]+$/.test(url)||!key){toast('Enter a valid Supabase URL and key');return}if(/service_role|secret/i.test(key)||key.startsWith('sb_secret_')){toast('Do not use a service-role or secret key in browser code');return}localStorage.setItem('sjrxpert_supabase_url',url);localStorage.setItem('sjrxpert_supabase_key',key);supabaseClient=null;initSupabaseClient();refreshAuthStatus();toast('Supabase settings saved on this device')}

function inventoryPage(){return head('Parts inventory','Track components, unit prices and available quantities.')+card('Stock list',`<div class="tablewrap"><table><thead><tr><th>Component</th><th>SKU</th><th>Qty</th><th>Unit price</th><th>Stock value</th></tr></thead><tbody>${db.inventory.map((p,i)=>`<tr><td><strong>${esc(p.name)}</strong></td><td>${esc(p.sku)}</td><td><input type="number" min="0" value="${p.qty}" onchange="editStock(${i},'qty',this.value)" style="width:70px;padding:7px;border:1px solid var(--line);border-radius:8px"></td><td><input type="number" min="0" value="${p.price}" onchange="editStock(${i},'price',this.value)" style="width:90px;padding:7px;border:1px solid var(--line);border-radius:8px"></td><td><strong>${money(p.qty*p.price)}</strong></td></tr>`).join('')}</tbody></table></div>`)+`<section class="card section"><div class="section-title">Add component to inventory</div><form class="formgrid" onsubmit="addStock(event)"><div class="field"><label>Component name</label><input name="name" required></div><div class="field"><label>SKU / part code</label><input name="sku" required></div><div class="field"><label>Quantity in stock</label><input name="qty" type="number" min="0" required></div><div class="field"><label>Unit price (₹)</label><input name="price" type="number" min="0" required></div><div><button class="btn">＋ Add to stock</button></div></form><p class="muted smalltxt">Demo note: stock values can be edited, but automatic stock deduction on repair completion is not enabled in this prototype.</p></section>`}
function editStock(i,k,v){db.inventory[i][k]=Math.max(0,+v||0);persist();showPage('inventory')}
function addStock(e){e.preventDefault();let f=new FormData(e.target);db.inventory.push({name:f.get('name'),sku:f.get('sku'),qty:+f.get('qty'),price:+f.get('price')});persist();showPage('inventory');toast('Inventory item added')}
function toggleUpiQr(jobId){let panel=document.getElementById('upiQrPanel'),method=document.getElementById('paymentMethod');if(!panel||!method)return;if(method.value!=='UPI'){panel.hidden=true;panel.innerHTML='';return}let upiId=(localStorage.getItem('sjrxpert_upi_id')||'').trim();if(!upiId||!upiId.includes('@')){panel.hidden=false;panel.innerHTML='<div class="smalltxt">Add a valid UPI ID in Settings → Shop profile, then save settings to generate a payment QR.</div>';return}let form=method.closest('form'),amount=Number(form?.querySelector('[name="amount"]')?.value||due(db.repairs.find(x=>x.id===jobId))||0),r=db.repairs.find(x=>x.id===jobId);let params=new URLSearchParams({pa:upiId,pn:localStorage.getItem('sjrxpert_shopName')||'SJR XPERT',cu:'INR',tn:'Repair '+jobId});if(amount>0)params.set('am',amount.toFixed(2));let uri='upi://pay?'+params.toString();panel.hidden=false;panel.innerHTML='<strong>Scan to pay with UPI</strong><p class="smalltxt muted">Amount: '+money(amount)+'</p><img alt="UPI payment QR code" style="width:210px;height:210px;max-width:100%;display:block;border:1px solid var(--line);border-radius:10px;background:white;padding:8px;margin:8px 0" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(uri)+'"><div class="smalltxt muted">Scan with a UPI app. Record the payment only after confirming it in your bank/UPI app. This QR does not verify payment automatically.</div>';let inp=form?.querySelector('[name="amount"]');if(inp&&!inp.dataset.qrBound){inp.dataset.qrBound='1';inp.addEventListener('input',()=>{if(method.value==='UPI')toggleUpiQr(jobId)})}}
function recordPayment(e,id){e.preventDefault();let f=new FormData(e.target),r=db.repairs.find(x=>x.id===id),amount=+f.get('amount');if(amount<=0||amount>due(r)){toast('Check payment amount and outstanding balance');return}r.paid=paid(r)+amount;db.payments.push({id:'PAY-'+Date.now().toString().slice(-6),job:id,customer:r.customer,amount,method:f.get('method'),ref:f.get('ref'),date:new Date().toISOString().slice(0,10)});persist();showPage('billing');toast('Manual payment entry saved')}
function paymentsPage(){return head('Payments','Log money received and keep a daily record.')+card('Payment history',`<div class="tablewrap"><table><thead><tr><th>Payment ID</th><th>Job</th><th>Customer</th><th>Method</th><th>Amount</th><th>Date</th></tr></thead><tbody>${db.payments.map(p=>`<tr><td>${esc(p.id)}</td><td>${esc(p.job)}</td><td>${esc(p.customer)}</td><td>${esc(p.method)}</td><td><strong>${money(p.amount)}</strong></td><td>${esc(p.date)}</td></tr>`).join('')||'<tr><td colspan="6">No payments recorded yet.</td></tr>'}</tbody></table></div><p class="muted smalltxt section">Payment entries are manual records. This demo does not connect to a payment gateway or scan QR codes.</p>`)}
function reportsPage(){let today=new Date().toISOString().slice(0,10),daily=db.payments.filter(p=>p.date===today),sum=daily.reduce((s,p)=>s+p.amount,0);return head('Earnings & reports','Daily earnings based on payments recorded in this browser.')+`<div class="grid">${stat('Today collected',money(sum),'₹','Confirmed manually')}${stat('Transactions',daily.length,'↗','Today')}${stat('Total unpaid',money(db.repairs.reduce((s,r)=>s+due(r),0)),'◷','Across all jobs')}${stat('Completed jobs',db.repairs.filter(r=>r.status==='Completed').length,'✓','All time')}</div>`+card('Today’s payment activity',`<div class="list">${daily.map(p=>`<div class="item"><div class="avatar">₹</div><div class="itemmain"><strong>${esc(p.customer)} · ${esc(p.job)}</strong><span class="muted smalltxt">${esc(p.method)} · ${esc(p.date)}</span></div><strong>${money(p.amount)}</strong></div>`).join('')||'<div class="empty">No payments recorded today.</div>'}</div><button class="btn alt section" onclick="exportReport()">⇩ Export CSV report</button>`)}
function exportReport(){let rows=[['Payment ID','Job','Customer','Amount','Method','Reference','Date'],...db.payments.map(p=>[p.id,p.job,p.customer,p.amount,p.method,p.ref,p.date])],csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='sjr-xpert-payments.csv';a.click();URL.revokeObjectURL(a.href)}
function aiPage(){return head('XPERT AI','Ask the secure SJR XPERT AI backend. Staff sign-in is required.')+`<section class="card"><div class="ai-bubble"><strong>✦ SJR XPERT AI</strong><p class="muted smalltxt">Your question is sent to the sjr-ai Supabase Edge Function. The OpenAI secret stays in Supabase Secrets and is never stored in this HTML file. Do not include customer-sensitive details.</p></div><div class="field section"><label>Your question</label><textarea id="aiPrompt" rows="4" placeholder="e.g. Explain how to diagnose a phone that is not charging safely."></textarea></div><div class="row section" style="flex-wrap:wrap"><button class="btn" id="askAiButton" onclick="askSjrAI()">✦ Ask SJR XPERT AI</button><button class="btn alt" onclick="usePrompt('Write a customer-friendly explanation for a repair and its itemised bill.')">Bill explanation prompt</button><button class="btn alt" onclick="openChatGPT()">Open ChatGPT website</button></div><div id="aiAnswer" class="card section" style="white-space:pre-wrap;display:none" aria-live="polite"></div><div class="section"><div class="section-title">Suggested prompts</div><div class="list"><button class="btn alt" onclick="usePrompt('Help me troubleshoot a phone charging issue safely, step by step.')">🔌 Diagnose charging fault</button><button class="btn alt" onclick="usePrompt('Explain this phone repair in simple customer-friendly language, including parts and labour.')">🧾 Explain repair bill</button><button class="btn alt" onclick="usePrompt('Create a mobile repair shop checklist for intake, diagnosis, parts approval, testing and handover.')">✓ Repair checklist</button></div></div></section>`}
async function askSjrAI(){const question=document.getElementById('aiPrompt')?.value.trim(),answerEl=document.getElementById('aiAnswer'),button=document.getElementById('askAiButton');if(!question){toast('Enter your question first');return}const client=initSupabaseClient();if(!client){toast('Configure Supabase in Settings first');showPage('settings');return}const {data,error:sessionError}=await client.auth.getSession();if(sessionError||!data.session){toast('Sign in with your staff account first');showPage('settings');return}if(button){button.disabled=true;button.textContent='Thinking…'}if(answerEl){answerEl.style.display='block';answerEl.textContent='Connecting securely to SJR XPERT AI…'}try{const {data:result,error}=await client.functions.invoke('sjr-ai',{body:{question}});if(error)throw error;if(!result||result.error)throw new Error(result?.error||'No answer returned');if(answerEl)answerEl.textContent=result.answer||'The AI returned an empty answer.'}catch(err){console.error(err);if(answerEl)answerEl.textContent='Could not get an AI response. Check that the sjr-ai function is deployed, JWT verification is enabled, OPENAI_API_KEY is saved in Supabase Secrets, and the function CORS origin matches your website. Details: '+String(err.message||err)}finally{if(button){button.disabled=false;button.textContent='✦ Ask SJR XPERT AI'}}}

function usePrompt(t){document.getElementById('aiPrompt').value=t}
function openChatGPT(){let p=document.getElementById('aiPrompt').value.trim()||'Help me manage a mobile phone repair shop with safe troubleshooting, clear itemised bills and customer communication.';window.open('https://chatgpt.com/?q='+encodeURIComponent(p),'_blank')}
function settingsPage(){return head('Settings','Shop profile and Supabase connection. Staff sign-in has been removed from this page.')+card('Shop profile',`<div class="formgrid"><div class="field"><label>Business name</label><input id="shopName" value="SJR XPERT"></div><div class="field"><label>Shop phone number</label><input id="shopPhone" type="tel" placeholder="Shop contact number"></div><div class="field full"><label>Shop address</label><textarea id="shopAddress" rows="2" placeholder="Door no., street, area, city, state, PIN code"></textarea></div><div class="field"><label>Currency</label><input value="INR — ₹" readonly></div><div class="field full"><label>Invoice footer / warranty terms</label><textarea id="terms" rows="3" placeholder="Enter your repair warranty terms and customer notes"></textarea></div><div class="field full"><label>UPI ID for payment QR</label><input id="upiId" type="text" placeholder="yourname@upi" autocomplete="off"><span class="muted smalltxt">UPI QR is a payment request only. Confirm money in your bank/UPI app; it does not verify payment automatically.</span></div></div><div class="row section" style="flex-wrap:wrap"><button class="btn" onclick="saveSettings()">Save settings</button><button class="btn alt" onclick="backupData()">Export data backup</button><button class="btn alt" onclick="document.getElementById('restoreFile').click()">Import backup</button><input type="file" id="restoreFile" accept="application/json" hidden onchange="restoreData(event)"></div>`)+card('Supabase project connection',`<p class="muted smalltxt">Use your Supabase Project URL and publishable/anon key only. Never enter a service-role key, database password or OpenAI secret key here. These public settings are stored in this browser.</p><div class="formgrid section"><div class="field full"><label>Supabase Project URL</label><input id="supabaseUrl" type="url" placeholder="https://your-project.supabase.co"></div><div class="field full"><label>Publishable / anon key</label><input id="supabaseKey" type="password" autocomplete="off" placeholder="sb_publishable_... or legacy anon key"></div></div><div class="row section" style="flex-wrap:wrap"><button class="btn" onclick="saveSupabaseSettings()">Save Supabase settings</button><button class="btn alt" onclick="testSupabaseConnection()">Test connection</button><button class="btn alt" onclick="showSupabaseSql()">Show secure customer SQL</button></div><div id="supabaseSqlHelp" class="smalltxt muted section" hidden></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="section-title">Bill and messaging</div><p class="muted smalltxt">Enter the shop address and phone above. Bills include the shop logo, shop address, customer address, itemised charges and totals. PDF uses your browser print dialog; choose Save as PDF. WhatsApp and SMS open a prefilled message and require you to press Send. WhatsApp does not allow a webpage to silently send a message or attach a PDF automatically.</p><div class="section-title">Production notes</div><p class="muted smalltxt">XPERT AI calls the sjr-ai Edge Function only after staff sign-in. Repair jobs, stock, bills and payment history in this version remain in this browser's local storage and do not sync to the cloud yet. UPI QR does not confirm payment. To go live, configure authenticated RLS for all business tables, disable public sign-ups, and implement a verified payment gateway backend.</p><div class="list"><div class="item"><div class="avatar">1</div><div class="itemmain"><strong>Secure AI backend</strong><span class="muted smalltxt">Supabase Edge Function sjr-ai + OPENAI_API_KEY secret.</span></div><span class="tag orange">Needs setup</span></div><div class="item"><div class="avatar">2</div><div class="itemmain"><strong>Cloud data sync</strong><span class="muted smalltxt">Repairs, stock, bills and payments are local only in this build.</span></div><span class="tag orange">Not enabled</span></div><div class="item"><div class="avatar">3</div><div class="itemmain"><strong>Verified payments</strong><span class="muted smalltxt">Requires a merchant account and server-side payment verification.</span></div><span class="tag orange">Not enabled</span></div></div>`)}

function saveSettings(){localStorage.setItem('sjrxpert_shopName',document.getElementById('shopName').value.trim()||'SJR XPERT');localStorage.setItem('sjrxpert_shopAddress',document.getElementById('shopAddress').value.trim());localStorage.setItem('sjrxpert_shopPhone',document.getElementById('shopPhone').value.trim());localStorage.setItem('sjrxpert_terms',document.getElementById('terms').value);localStorage.setItem('sjrxpert_upi_id',document.getElementById('upiId').value.trim());toast('Shop address, phone, terms and UPI ID saved');}
function backupData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='sjr-xpert-backup.json';a.click();URL.revokeObjectURL(a.href)}
function restoreData(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!d.repairs||!d.customers||!d.inventory)throw Error();db=d;persist();showPage('dashboard');toast('Backup imported')}catch(err){toast('Invalid SJR XPERT backup')}};reader.readAsText(file)}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>el.classList.remove('show'),2400)}
nav();showPage('dashboard');
</script>
</body></html>
